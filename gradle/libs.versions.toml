[versions]
android-gradle-plugin = "8.11.1"
kotlin = "2.2.0"

appcompat = "1.7.1"
security-crypto = "1.1.0"
argon2 = "1.6.0"
coroutines = "1.10.2"
gradle-infrastructure = "0.19.1"
rxjava3 = "3.1.12"
gradle-android-cacheFix = "3.0.3"
hilt = "2.57"
navigation = "2.9.8"
lifecycle = "2.10.0"
core-ktx = "1.18.0"
constraintlayout = "2.2.1"

detekt = "1.23.8"
dependency-versions = "0.54.0"
dependency-check = "12.2.2"
publish-plugin = "0.28.0"

junit = "4.13.2"
junit-ext = "1.3.0"
espresso = "3.7.0"
assertj = "3.27.7"
mockito = "5.23.0"
mockito-kotlin = "2.2.0"
test-runner = "1.7.0"
test-rules = "1.7.0"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }
argon2kt = { module = "com.lambdapioneer.argon2kt:argon2kt", version.ref = "argon2" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
rxjava3 = { module = "io.reactivex.rxjava3:rxjava", version.ref = "rxjava3" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }

detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "junit-ext" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-kotlin = { module = "com.nhaarman.mockitokotlin2:mockito-kotlin", version.ref = "mockito-kotlin" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "test-rules" }

android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "android-gradle-plugin" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
gradle-android-cacheFixGradlePlugin = { module = "gradle.plugin.org.gradle.android:android-cache-fix-gradle-plugin", version.ref = "gradle-android-cacheFix" }
infrastructure-android = { module = "com.redmadrobot.build:infrastructure-android", version.ref = "gradle-infrastructure" }
infrastructure-publish = { module = "com.redmadrobot.build:infrastructure-publish", version.ref = "gradle-infrastructure" }
publish-gradlePlugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "publish-plugin" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
# The following plugins are intentionally absent from this block: their JARs are on the
# buildscript classpath via buildSrc dependencies, so Gradle forbids specifying a version
# in plugins {}. Apply them with plain id("...") instead:
#   com.android.application / com.android.library  (libs.android.gradlePlugin)
#   org.jetbrains.kotlin.android / kapt            (libs.kotlin.gradlePlugin)
#   io.gitlab.arturbosch.detekt                    (libs.detekt.gradlePlugin)
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
dependency-versions = { id = "com.github.ben-manes.versions", version.ref = "dependency-versions" }
dependency-check = { id = "org.owasp.dependencycheck", version.ref = "dependency-check" }
infrastructure-detekt = { id = "com.redmadrobot.detekt", version.ref = "gradle-infrastructure" }

